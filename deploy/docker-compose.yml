name: clip

services:
  web:
    container_name: clip-web
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://cap:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/cap
      WEB_URL: ${WEB_URL:?Set WEB_URL}
      NEXTAUTH_URL: ${WEB_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:?Set DATABASE_ENCRYPTION_KEY}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:?Set MEDIA_SERVER_WEBHOOK_SECRET}
      MEDIA_SERVER_URL: http://media-server:3456
      MEDIA_SERVER_WEBHOOK_URL: http://web:3000
      CAP_AWS_ACCESS_KEY: ${CAP_AWS_ACCESS_KEY:?Set CAP_AWS_ACCESS_KEY}
      CAP_AWS_SECRET_KEY: ${CAP_AWS_SECRET_KEY:?Set CAP_AWS_SECRET_KEY}
      CAP_AWS_BUCKET: ${CAP_AWS_BUCKET:?Set CAP_AWS_BUCKET}
      CAP_AWS_REGION: ${CAP_AWS_REGION:-auto}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-${S3_PUBLIC_ENDPOINT}}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_FORCE_PUT_UPLOADS: ${S3_FORCE_PUT_UPLOADS:-true}
      CAP_VIDEOS_DEFAULT_PUBLIC: ${CAP_VIDEOS_DEFAULT_PUBLIC:-false}
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-single sign-on}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:?Set OIDC_ALLOWED_EMAIL_DOMAINS}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-}
      DESKTOP_UPDATES_BASE_URL: ${DESKTOP_UPDATES_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_DOMAIN: ${RESEND_FROM_DOMAIN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clip-network

  media-server:
    container_name: clip-media-server
    image: ${IMAGE_REGISTRY}/media-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3456/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - clip-network

  mysql:
    container_name: clip-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cap
      MYSQL_USER: cap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command:
      - --max_connections=1000
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - clip-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cap", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - clip-network

volumes:
  clip-mysql-data:

networks:
  clip-network:
    driver: bridge
