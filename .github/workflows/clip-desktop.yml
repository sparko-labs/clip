name: Clip desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: clip-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            runner: macos-latest
            script: build-desktop-macos.sh
            artifact: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            script: build-desktop-windows.sh
            artifact: windows
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            script: build-desktop-linux.sh
            artifact: linux
    env:
      TARGET: ${{ matrix.settings.target }}
      SIGN_BUILDS: "false"
      WEB_URL: ${{ vars.WEB_URL || 'https://clip.sparkosol.co' }}
      BRAND_NAME: ${{ vars.BRAND_NAME || 'ClipSpark' }}
      BRAND_IDENTIFIER: ${{ vars.BRAND_IDENTIFIER || 'com.sparkosol.clipspark' }}
      URL_SCHEME: ${{ vars.URL_SCHEME || 'clipspark' }}
      UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      CI_PIPELINE_IID: ${{ github.run_number }}
      CI_JOB_ID: ${{ github.run_id }}-${{ matrix.settings.artifact }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/install-desktop-deps

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.settings.target }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.settings.target }}
          prefix-key: v1-rust-release
          save-cache: true
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop-gpui -> target

      - uses: ./.github/actions/setup-js

      - name: Increase swap space (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo swapoff /mnt/swapfile 2>/dev/null || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Increase pagefile size (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Build
        shell: bash
        run: ./scripts/ci/${{ matrix.settings.script }}

      - name: Keep build output
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.settings.artifact }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Stage assets and update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/ci/release-manifest.mjs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-upload/* \
            --title "$RELEASE_TAG" --generate-notes --verify-tag
