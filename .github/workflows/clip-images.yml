name: Clip images

on:
  push:
    branches: [custom]
  workflow_dispatch:

concurrency:
  group: clip-images
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  WEB_URL: ${{ vars.WEB_URL || 'https://clip.sparkosol.co' }}
  BRAND_NAME: ${{ vars.BRAND_NAME || 'ClipSpark' }}
  URL_SCHEME: ${{ vars.URL_SCHEME || 'clipspark' }}
  REGISTRY: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'clip' }}

jobs:
  images:
    name: Build and push images
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' && vars.GAR_LOCATION != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_WEB_URL=${{ env.WEB_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ env.BRAND_NAME }}
            NEXT_PUBLIC_DESKTOP_URL_SCHEME=${{ env.URL_SCHEME }}
          tags: |
            ${{ env.REGISTRY }}/web:latest
            ${{ env.REGISTRY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Media server image
        uses: docker/build-push-action@v6
        with:
          context: apps/media-server
          file: apps/media-server/Dockerfile.standalone
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/media-server:latest
            ${{ env.REGISTRY }}/media-server:${{ github.sha }}
          cache-from: type=gha,scope=media-server
          cache-to: type=gha,scope=media-server,mode=max
