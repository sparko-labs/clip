stages: [check, build, release, sync]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "custom"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  SIGN_BUILDS: "false"
  BUN_VERSION: "1.4.0"
  WEB_URL: "https://cap.sparkosol.co"

.node-bun:
  image: node:24-bookworm
  before_script:
    - npm install --global "bun@${BUN_VERSION}"
    - bun --version

# ---------------------------------------------------------------- checks ----

check:web:
  extends: .node-bun
  stage: check
  script:
    - bun install --frozen-lockfile
    - bun run biome ci . --linter-enabled=false
    - bun run typecheck
    - bun run --cwd apps/web vitest run __tests__/unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "custom"

check:scripts:
  extends: .node-bun
  stage: check
  script:
    - >
      node --test
      scripts/ci/publish-release.test.mjs
      scripts/bundle-gpui.test.mjs
      scripts/build-macos-packages.test.mjs
      scripts/finalize-macos-packages.test.mjs
      scripts/prepare-gpui-dependency.test.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "custom"

# ---------------------------------------------------------- web images ----
#
# Set WEB_IMAGE_REGISTRY (and REGISTRY_HOST, REGISTRY_USER, REGISTRY_PASSWORD)
# to push somewhere other than the GitLab Container Registry, for example a
# Google Artifact Registry repository.
#
# The Linux jobs have no runner tag, so any runner that takes untagged jobs
# (a shared runner) picks them up. The image jobs use Docker-in-Docker, which
# needs a privileged runner. On a runner that mounts /var/run/docker.sock
# instead, delete the services block and the DOCKER_HOST/DOCKER_TLS_CERTDIR
# variables below.

.docker-image:
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  stage: build
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "custom"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - export REGISTRY_HOST="${REGISTRY_HOST:-$CI_REGISTRY}"
    - export REGISTRY_USER="${REGISTRY_USER:-$CI_REGISTRY_USER}"
    - export REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - export IMAGE_ROOT="${WEB_IMAGE_REGISTRY:-$CI_REGISTRY_IMAGE}"
    - echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"

build:web-image:
  extends: .docker-image
  script:
    - |
      : "${WEB_URL:?Set the WEB_URL CI/CD variable}"
      TAGS="-t ${IMAGE_ROOT}/web:${CI_COMMIT_SHORT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t ${IMAGE_ROOT}/web:${CI_COMMIT_TAG}"; fi
      if [ "$CI_COMMIT_BRANCH" = "custom" ]; then TAGS="$TAGS -t ${IMAGE_ROOT}/web:latest"; fi
      docker build -f apps/web/Dockerfile \
        --build-arg "NEXT_PUBLIC_WEB_URL=${WEB_URL}" \
        --build-arg "NEXT_PUBLIC_BRAND_NAME=${BRAND_NAME}" \
        --build-arg "NEXT_PUBLIC_DESKTOP_URL_SCHEME=${URL_SCHEME}" \
        $TAGS .
      docker push --all-tags "${IMAGE_ROOT}/web"

build:media-server-image:
  extends: .docker-image
  script:
    - |
      TAGS="-t ${IMAGE_ROOT}/media-server:${CI_COMMIT_SHORT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t ${IMAGE_ROOT}/media-server:${CI_COMMIT_TAG}"; fi
      if [ "$CI_COMMIT_BRANCH" = "custom" ]; then TAGS="$TAGS -t ${IMAGE_ROOT}/media-server:latest"; fi
      docker build -f apps/media-server/Dockerfile.standalone $TAGS apps/media-server
      docker push --all-tags "${IMAGE_ROOT}/media-server"
  rules:
    - if: $CI_COMMIT_BRANCH == "custom"
      changes: [apps/media-server/**/*]
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# ------------------------------------------------------ desktop builds ----
#
# Shell-executor runners with the matching tag. Persistent workspace so the
# Rust target directory, ../zed-cap checkout and CARGO_HOME survive between
# jobs. Signing credentials are protected variables, so signed builds only run
# on protected tags.

.desktop:
  stage: build
  interruptible: false
  timeout: 3h
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e target/ -e node_modules/ -e apps/desktop-gpui/target/
  artifacts:
    paths: [release-assets/]
    expire_in: 14 days
    when: on_success
  rules:
    - if: $CI_COMMIT_TAG =~ /^desktop-v\d+\.\d+\.\d+/
      variables:
        SIGN_BUILDS: "true"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "custom"
      when: manual
      allow_failure: true

build:desktop-macos:
  extends: .desktop
  tags: [macos]
  variables:
    TARGET: aarch64-apple-darwin
  script:
    - ./scripts/ci/build-desktop-macos.sh

build:desktop-windows:
  extends: .desktop
  tags: [windows]
  variables:
    TARGET: x86_64-pc-windows-msvc
  script:
    - ./scripts/ci/build-desktop-windows.sh

build:desktop-linux:
  extends: .desktop
  tags: [linux-desktop]
  variables:
    TARGET: x86_64-unknown-linux-gnu
  script:
    - ./scripts/ci/build-desktop-linux.sh

# ------------------------------------------------------------- release ----

release:publish:
  stage: release
  image: oven/bun:1.4.0
  interruptible: false
  needs:
    - job: build:desktop-macos
      artifacts: true
      optional: true
    - job: build:desktop-windows
      artifacts: true
      optional: true
    - job: build:desktop-linux
      artifacts: true
      optional: true
  script:
    - |
      VERSION="${CI_COMMIT_TAG#desktop-v}"
      mkdir -p /tmp/publish
      cp scripts/ci/publish-release.mjs /tmp/publish/
      (cd /tmp/publish && bun add @aws-sdk/client-s3@3)
      RELEASE_VERSION="$VERSION" RELEASE_ASSETS_DIR="$CI_PROJECT_DIR/release-assets" \
        bun /tmp/publish/publish-release.mjs
  rules:
    - if: $CI_COMMIT_TAG =~ /^desktop-v\d+\.\d+\.\d+/

# ---------------------------------------------------------------- sync ----

sync:upstream:
  stage: sync
  image: alpine:3.20
  interruptible: false
  before_script:
    - apk add --no-cache git bash curl
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - bash scripts/ci/sync-upstream.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
